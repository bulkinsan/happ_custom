<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happ VPN — Settings</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body {
      width: 100%;
      min-height: 100vh;
      padding: 0;
    }
    .settings-page {
      padding: 24px 20px;
      max-width: 480px;
      margin: 0 auto;
    }
    .settings-page h1 {
      font-size: 20px;
      color: #e0e6ed;
      margin-bottom: 24px;
    }
    .settings-page h2 {
      font-size: 14px;
      color: #8a9aa8;
      margin-bottom: 8px;
      margin-top: 20px;
    }
    .settings-page label {
      display: block;
      font-size: 12px;
      color: #5a6a7e;
      margin-bottom: 6px;
    }
    .settings-page input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #1a2a3a;
      border-radius: 8px;
      background: #1a2a3a;
      color: #e0e6ed;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .settings-page input[type="text"]:focus {
      border-color: #4fc3f7;
    }
    .settings-page .hint {
      font-size: 11px;
      color: #4a5a6e;
      margin-top: 6px;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 16px;
    }
    .btn-primary {
      background: #4fc3f7;
      color: #0f1923;
    }
    .btn-primary:hover {
      background: #39b0e4;
    }
    .btn-secondary {
      background: #1a2a3a;
      color: #8a9aa8;
      margin-left: 8px;
    }
    .btn-secondary:hover {
      background: #2a3a4e;
      color: #e0e6ed;
    }
    #save-status {
      margin-top: 12px;
      font-size: 13px;
    }
    .save-ok { color: #66bb6a; }
    .save-err { color: #ef5350; }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #1a2a3a;
      border-radius: 8px;
      margin-top: 8px;
    }
    .status-label { font-size: 13px; color: #8a9aa8; }
    .status-value { font-size: 13px; color: #e0e6ed; }
  </style>
</head>
<body>
  <div class="settings-page">
    <h1>⚙ Settings</h1>

    <h2>Subscription</h2>
    <label for="sub-url">Subscription URL (SSH proxy link)</label>
    <input type="text" id="sub-url" placeholder="https://sub.example.com/your-key" />
    <div class="hint">Paste your subscription URL like https://sub.magnitvpn.org/your-key</div>

    <div>
      <button class="btn btn-primary" id="save-btn">Save</button>
      <button class="btn btn-secondary" id="test-btn">Test</button>
    </div>
    <div id="save-status"></div>

    <h2>Connection Status</h2>
    <div class="status-row">
      <span class="status-label">Status</span>
      <span class="status-value" id="status-display">Disconnected</span>
    </div>
    <div class="status-row">
      <span class="status-label">Server</span>
      <span class="status-value" id="server-display">—</span>
    </div>
    <div class="status-row">
      <span class="status-label">Debugger</span>
      <span class="status-value" id="debugger-display">Not attached</span>
    </div>
  </div>
  <script src="settings.js" type="module"></script>
</body>
</html>
